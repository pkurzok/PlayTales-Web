# Feature List                            Edit, add or remove features to be presented.
#                                         Order matters: the first rows are the ones a parent reads.
#                                         Icons must exist in Font Awesome 5.6.3 Free (see _includes/head.html).
#                                         Written as benefits: the title says what a family gets, the
#                                         description names the feature that delivers it. Say "with Pro"
#                                         wherever a benefit depends on it (CarPlay, the offline view).
#                                         No ": " or " #" inside a value — YAML would split or truncate it.
features                                  :

  - title                                 : Peace and quiet on the back seat
    description                           : No signal in the car? Whatever Apple Music has downloaded to the device, PlayTales still shows and plays — and favourites and recently played sit right on the CarPlay screen. The offline view and CarPlay come with Pro.
    fontawesome_icon_name                 : car

  - title                                 : Bedtime without anyone getting up
    description                           : The sleep timer stops the story after anything from five minutes to an hour — or right at the end of the episode.
    fontawesome_icon_name                 : moon

  - title                                 : You decide how long they listen
    description                           : Set a daily or weekly limit, guarded by your PIN. For long car journeys there's “ten more minutes” or “no limit today”. At no extra cost, and the counting stays on the device.
    fontawesome_icon_name                 : hourglass-half

  - title                                 : Kids listen on their own — even before they can read
    description                           : Big, colourful covers instead of menus, and PlayTales can read the titles aloud. Your child finds their favourite episode without help.
    fontawesome_icon_name                 : child

  - title                                 : Pick up exactly where they left off
    description                           : PlayTales remembers the spot to the second — and carries it through your private iCloud, from iPhone to iPad and back.
    fontawesome_icon_name                 : play-circle

  - title                                 : Nothing for kids to get lost in
    description                           : Search can be switched off entirely, and the settings sit behind your PIN or a math task children can't solve.
    fontawesome_icon_name                 : lock

  - title                                 : Every story in your Apple Music
    description                           : No second library and no buying episodes one by one. PlayTales plays the audio plays and audiobooks on Apple Music — all you need is your subscription.
    fontawesome_icon_name                 : music

  - title                                 : “Play Paw Patrol” — and it plays
    description                           : Siri and Shortcuts start a story when asked. Favourites turn up in Spotlight search too.
    fontawesome_icon_name                 : microphone


