# Feature List                            Edit, add or remove features to be presented.
#                                         Order matters: the first rows are the ones a parent reads.
#                                         Icons must exist in Font Awesome 5.6.3 Free (see _includes/head.html).
features                                  :

  - title                                 : Listen offline
    description                           : No signal? No problem. Whatever Apple Music has downloaded to the device, PlayTales shows and plays without a connection — in the car, on the train, on holiday.
    fontawesome_icon_name                 : wifi

  - title                                 : Sleep timer
    description                           : From five minutes to an hour, or simply until the end of the episode. The story stops by itself, so nobody has to get up.
    fontawesome_icon_name                 : moon

  - title                                 : Apple Music Integration
    description                           : Access the largest streaming catalog and play every audio play, audiobook and album on offer from Apple.
    fontawesome_icon_name                 : music

  - title                                 : Favorites
    description                           : Keep your favourite stories for quick access — as big, colourful tiles made for small fingers.
    fontawesome_icon_name                 : heart

  - title                                 : Easy to operate for kids
    description                           : Big buttons, no menus, nothing to get lost in. Browse albums with Cover Flow or in a tile view.
    fontawesome_icon_name                 : child

  - title                                 : Voice output
    description                           : You can't read yet? No problem! Have the titles of artists and episodes read to you.
    fontawesome_icon_name                 : comment

  - title                                 : Pick up where you left off
    description                           : PlayTales remembers the playback position of recently played albums — down to the second.
    fontawesome_icon_name                 : play-circle

  - title                                 : CarPlay
    description                           : Keep listening in the car without turning around. Recently played and favourites right on the dashboard.
    fontawesome_icon_name                 : car

  - title                                 : In sync on every device
    description                           : Favourites and playback positions travel with you through your own private iCloud — from iPhone to iPad and back.
    fontawesome_icon_name                 : cloud

  - title                                 : Siri, Shortcuts and Spotlight
    description                           : Just say “Play Paw Patrol in PlayTales”. Favourites turn up in Spotlight search too (iOS 18 and later).
    fontawesome_icon_name                 : microphone

  - title                                 : Parents area
    description                           : Adapt PlayTales to the needs of your little ones, for example by turning the search off. Behind a small arithmetic task that children can't solve.
    fontawesome_icon_name                 : lock

  - title                                 : AirPlay and Bluetooth Support
    description                           : You have an external speaker? Great! PlayTales also plays directly to your ears or on the big speakers.
    fontawesome_icon_name                 : bullhorn

  - title                                 : Dark and Lightmode
    description                           : Whether you listen during the day or in bed at night, PlayTales is dressed for the occasion.
    fontawesome_icon_name                 : lightbulb


