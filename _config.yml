#page title
page_title                                : PlayTales                                 # Set explicitly: left empty, the <title> is filled by JavaScript from the iTunes API,
                                                                                      # so crawlers that don't run JS see an empty title.

# App Info
ios_app_id                                : 6444850972                                # Required. Enter iOS app ID to automatically populate name, price and icons (e.g. 718043190).
ios_app_country                           : us                                        # Required outside USA. Enter 2 letter country code as in https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2

appstore_link                             : https://apps.apple.com/us/app/id6444850972 # Set explicitly: left empty, the href of the App Store button is filled in by
                                                                                      # jQuery from the iTunes API, so a crawler — and a visitor without JS — is
                                                                                      # handed a dead link. It also feeds `installUrl` in the JSON-LD.
playstore_link                            :                                           # Enter Google Play Store URL.
presskit_download_link                    :                                           # Deliberately empty: the press page is already in the nav via _pages/press.md.
                                                                                      # Setting this too would duplicate the nav entry.
presskit_bundle                           : /assets/presskit/PlayTales-Presskit.zip   # The one-click asset bundle, linked from the press page.
                                                                                      # Rebuild with tools/build-presskit.sh whenever an asset changes.

app_icon                                  :                                           # Automatically populates if not set and if iOS app ID is set.  Otherwise enter path to icon file manually.
app_name                                  :                                           # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_price                                 :                                           # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_description                           : The audio play player for kids — Apple Music, offline listening and a sleep timer

enable_smart_app_banner                   : true                                      # Set to true to show a smart app banner at top of page on mobile devices.

# Site metadata                           Used for <html lang>, canonical URLs and social-share cards.
url                                       : https://play-tales.app                     # Jekyll's own key — `absolute_url` needs it for og:image and canonical.
                                                                                      # playtales.peterkurzok.de 301s here (Cloudflare redirect rule) and must stay
                                                                                      # alive: every shipped 1.x build links to it from Settings ▸ Privacy.
site_lang                                 : en
og_locale                                 : en_US
social_share_image                        : /assets/Promo.png                          # 2048×1024, safe for og:image and Twitter's summary_large_image.

# Sibling site                            hoerspieler.app is this same app in German, page for page. Without the
                                          # reciprocal hreflang links these feed (_includes/head.html), a search engine
                                          # reads the two domains as separate sites competing for one intent and may
                                          # serve a German parent this page. Both sites use the same permalinks, so
                                          # `page.url` maps 1:1 and needs no table.
alternate_url                             : https://hoerspieler.app
alternate_lang                            : de
x_default_url                             : https://play-tales.app                     # The fallback for locales neither site targets — English travels further.

app_price_currency                        : USD                                        # Only feeds the JSON-LD offer. The price a visitor sees still comes from the
                                                                                      # iTunes API, which knows the store the visitor is actually in.



